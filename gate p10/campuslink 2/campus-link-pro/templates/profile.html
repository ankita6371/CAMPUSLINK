{% extends "base.html" %}

{% block title %}Admin Profile | CAMPUSLINK{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Admin Profile</h1>
        <p>Placement Officer account information.</p>
    </div>
</div>

<div class="content-card">

    <div class="student-info">

        <div class="avatar">
            A
        </div>

        <div>
            <h2>Admin</h2>
            <p>Placement Officer</p>
        </div>

    </div>

    <hr>

    <div class="form-grid">

        <div class="form-group">
            <label>Name</label>
            <input type="text" value="Admin" readonly>
        </div>

        <div class="form-group">
            <label>Role</label>
            <input type="text" value="Placement Officer" readonly>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" value="admin@campuslink.edu" readonly>
        </div>

        <div class="form-group">
            <label>Department</label>
            <input type="text" value="Training & Placement" readonly>
        </div>

    </div>

</div>

{% endblock %}
