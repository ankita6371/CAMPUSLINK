{% extends "base.html" %}

{% block title %}Edit Company | CAMPUSLINK{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Edit Company</h1>
        <p>Update company information.</p>
    </div>

    <div class="page-actions">

        <a href="{{ url_for('companies') }}" class="btn btn-secondary">
            ← Back to Companies
        </a>

    </div>

</div>


<div class="content-card">

    <div class="section-header">

        <div>
            <h2>Company Details</h2>
            <p>Modify the information below and save the changes.</p>
        </div>

    </div>


    <form
        method="POST"
        action="{{ url_for('edit_company', company_id=company['id']) }}"
    >

        <div class="form-grid">

            

            <div class="form-group">

                <label for="name">
                    Company Name *
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ company['name'] }}"
                    placeholder="Enter company name"
                    required
                >

            </div>


            

            <div class="form-group">

                <label for="industry">
                    Industry
                </label>

                <input
                    type="text"
                    id="industry"
                    name="industry"
                    value="{{ company['industry'] or '' }}"
                    placeholder="e.g. IT Services"
                >

            </div>


            

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ company['location'] or '' }}"
                    placeholder="e.g. Bengaluru, India"
                >

            </div>


            

            <div class="form-group">

                <label for="website">
                    Website
                </label>

                <input
                    type="url"
                    id="website"
                    name="website"
                    value="{{ company['website'] or '' }}"
                    placeholder="https://example.com"
                >

            </div>

        </div>


        

        <div class="form-actions">

            <a
                href="{{ url_for('companies') }}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
