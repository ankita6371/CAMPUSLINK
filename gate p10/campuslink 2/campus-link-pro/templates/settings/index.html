{% extends "base.html" %}

{% block title %}Settings | CAMPUSLINK{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Settings</h1>
        <p>Manage CAMPUSLINK system settings.</p>
    </div>

</div>


<div class="content-card">

    <div class="card-header">
        <div>
            <h2>System Settings</h2>
            <p>CAMPUSLINK configuration and preferences.</p>
        </div>
    </div>


    <div class="form-grid">

        <div class="form-group">
            <label>Application Name</label>
            <input type="text" value="CAMPUSLINK" readonly>
        </div>

        <div class="form-group">
            <label>Application Version</label>
            <input type="text" value="1.0.0" readonly>
        </div>

        <div class="form-group">
            <label>User Role</label>
            <input type="text" value="Placement Officer" readonly>
        </div>

        <div class="form-group">
            <label>Database</label>
            <input type="text" value="SQLite" readonly>
        </div>

    </div>

</div>

{% endblock %}
